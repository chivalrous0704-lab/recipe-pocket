<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>うちレシピ</title>
<style>
:root{
  --bg:#f7f5f0;--card:#fff;--text:#26231f;--muted:#7b746c;--accent:#d46a3a;
  --accent2:#f4dfd2;--border:#e7e0d8;--shadow:0 8px 24px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:rgba(247,245,240,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.wrap{max-width:980px;margin:auto;padding:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:24px;margin:0}.sub{font-size:12px;color:var(--muted)}
.version{display:inline-block;margin-left:7px;font-size:11px;font-weight:700;color:#8b3f1f;background:var(--accent2);padding:3px 7px;border-radius:999px;vertical-align:middle}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:white}.ghost{background:white;border:1px solid var(--border);color:var(--text)}
.searchbar{display:flex;gap:8px;margin-top:14px}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;background:white;font:inherit}
textarea{min-height:90px;resize:vertical}
.filters{display:flex;gap:8px;overflow:auto;padding:12px 0 2px}
.chip{white-space:nowrap;background:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 12px;cursor:pointer}
.chip.active{background:var(--accent2);border-color:var(--accent);color:#8b3f1f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden}
.card-top{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:12px;align-items:start}
.card-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.card-thumb{width:84px;height:84px;object-fit:cover;border-radius:14px;border:1px solid var(--border);background:#f2efe9;display:none}
.detail-img{width:100%;max-height:340px;object-fit:cover;border-radius:18px;margin:10px 0 14px;background:#f2efe9}
.image-help{font-size:11px;color:var(--muted);margin-top:-8px}
.photo-picker{display:grid;gap:8px}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap}
.photo-crop{display:none;gap:8px}
.photo-crop.show{display:grid}
.photo-crop-frame{width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#161616;touch-action:none}
.photo-crop-frame canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.photo-crop-frame canvas:active{cursor:grabbing}
.photo-zoom-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.photo-zoom-row input{padding:0}
.photo-zoom-value{font-size:12px;color:var(--muted);min-width:42px;text-align:right}
.card h3{margin:4px 0 8px;font-size:18px}.meta{color:var(--muted);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:11px;background:#f2efe9;border-radius:999px;padding:5px 8px}
.fav{font-size:22px;background:none;padding:0;line-height:1}
.empty{padding:40px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.show{display:flex}
.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:white;border-radius:24px 24px 0 0;padding:20px}
.close{float:right;background:#f2efe9;padding:8px 11px}
.section{margin-top:22px}.section h3{font-size:15px;margin-bottom:8px}
ul,ol{padding-left:22px;line-height:1.75}.detail-title{font-size:25px;margin:10px 0 5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.form{display:grid;gap:12px}.help{font-size:12px;color:var(--muted);margin-top:-6px}
.badge{display:inline-block;background:var(--accent2);color:#8b3f1f;border-radius:999px;padding:6px 9px;font-size:12px;margin-right:5px}
.serving-box{display:flex;align-items:center;gap:10px;margin:16px 0 4px;padding:12px;background:#faf7f3;border:1px solid var(--border);border-radius:16px}
.serving-box strong{margin-right:auto}
.serving-btn{width:42px;height:42px;padding:0;border-radius:50%;background:white;border:1px solid var(--border);font-size:22px}
.serving-count{min-width:64px;text-align:center;font-weight:800;font-size:18px}
.scale-label{font-size:12px;color:var(--muted);margin-top:5px}
.import-notice{display:none;background:#fff6d8;border:1px solid #f0d98a;color:#6b5412;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5}
.import-notice.show{display:block}
.code-import{display:flex;gap:8px;margin-top:10px}
.code-import input{min-width:0}
.related{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.related button{font-size:12px;padding:8px 10px}
.source-box{background:#faf7f3;border:1px solid var(--border);border-radius:14px;padding:12px;line-height:1.6}
.source-box a{word-break:break-all}
.chatgpt-import{margin-top:10px;padding:12px;background:#fff;border:1px solid var(--border);border-radius:16px}
.chatgpt-import summary{cursor:pointer;font-weight:800}
.chatgpt-import textarea{margin-top:10px;min-height:150px}
.chatgpt-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
footer{padding:30px 16px;text-align:center;color:var(--muted);font-size:12px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px;max-height:86vh}}
</style>
</head>
<body>
<!-- app-version: v2.2 -->
<header>
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>🍳 うちレシピ <span class="version">v2.2</span></h1>
        <div class="sub">家で使うレシピを、見やすくひとまとめ</div>
      </div>
      <button class="primary" onclick="openAddBlank()">＋ 追加</button>
    </div>
    <div class="searchbar">
      <input id="search" placeholder="料理名・材料で検索" oninput="render()">
      <button class="ghost" onclick="toggleFavOnly()">★</button>
    </div>
    <details class="chatgpt-import">
      <summary>🤖 ChatGPTから貼り付け登録</summary>
      <textarea id="chatgptPaste" placeholder='ChatGPTが出した登録用データをここに貼り付け'></textarea>
      <div class="chatgpt-actions">
        <button class="primary" onclick="importFromPaste()">読み込む</button>
        <button class="ghost" onclick="clearPaste()">クリア</button>
      </div>
      <div class="help">※ 今後はこの貼り付け登録が基本です。同名レシピは上書きか別保存を選べます。</div>
    </details>
    <div class="filters" id="filters"></div>
  </div>
</header>

<main class="wrap">
  <div id="grid" class="grid"></div>
</main>
<footer>データはこの端末のブラウザに保存されます。</footer>

<div class="modal" id="detailModal">
  <div class="sheet">
    <button class="close" onclick="closeModal('detailModal')">✕</button>
    <div id="detailBody"></div>
  </div>
</div>

<div class="modal" id="addModal">
  <div class="sheet">
    <button class="close" onclick="closeModal('addModal')">✕</button>
    <h2 id="formTitle">レシピを追加</h2>
    <div class="form">
      <div id="importNotice" class="import-notice">ChatGPTからレシピを読み込みました。内容を確認して「保存する」を押してください。</div>
      <input id="fTitle" placeholder="料理名">
      <div class="row">
        <select id="fCategory">
          <option>主菜</option><option>副菜</option><option>汁物</option><option>ご飯・麺</option><option>デザート</option><option>その他</option>
        </select>
        <input id="fServings" placeholder="人数 例：4人分">
      </div>
      <input id="fTime" placeholder="調理時間 例：10分">
      <div class="photo-picker">
        <input id="fPhoto" type="file" accept="image/*" onchange="handlePhotoSelect(event)">
        <div class="photo-actions">
          <button type="button" class="ghost" onclick="removePendingPhoto()">写真を削除</button>
        </div>
        <div id="photoCrop" class="photo-crop">
          <div class="photo-crop-frame">
            <canvas id="photoCropCanvas" width="900" height="675"></canvas>
          </div>
          <div class="photo-zoom-row">
            <span>縮小</span>
            <input id="photoZoom" type="range" min="1" max="3" step="0.05" value="1" oninput="setPhotoZoom(this.value)">
            <span id="photoZoomValue" class="photo-zoom-value">1.00×</span>
          </div>
          <div class="image-help">写真を指で動かして位置調整。スライダーで拡大・縮小できます。</div>
        </div>
        <div class="image-help">※ 写真は端末内に保存します。保存時に自動で圧縮します。</div>
      </div>
      <textarea id="fIngredients" placeholder="材料を1行ずつ入力&#10;水 800ml&#10;鶏ガラスープの素 大さじ1"></textarea>
      <textarea id="fSteps" placeholder="作り方を1工程ずつ入力&#10;鍋に調味料を入れて沸かす&#10;卵を流し入れる"></textarea>
      <input id="fTags" placeholder="タグ（カンマ区切り）例：簡単,中華,卵">
      <textarea id="fMemo" placeholder="メモ・家族の感想・次回の変更点"></textarea>
      <input id="fSourceName" placeholder="出典名 例：Instagram / TikTok / YouTube / ブログ">
      <input id="fSourceAuthor" placeholder="投稿者名・アカウント名（任意）">
      <input id="fSourceUrl" placeholder="元レシピのURL（任意）" inputmode="url">
      <button class="primary" onclick="saveRecipe()">保存する</button>
      <div class="help">※ レシピはこの端末内に保存されます。</div>
    </div>
  </div>
</div>

<script>
const recipeCodeRegistry = {"CHAR-SHU-001":{"title":"圧力鍋チャーシュー","category":"主菜","servings":"約1kg","time":"加圧20〜25分＋一晩","ingredients":["豚バラブロックまたは肩ロース 1kg","長ねぎ（青い部分） 1本分","しょうが 1かけ（薄切り）","にんにく 2片（つぶす）","水 400ml","醤油 200ml","酒 200ml","みりん 100ml","砂糖 大さじ4（約50g）"],"steps":["油をひかずに豚肉の全面を焼き、こんがり焼き色を付ける。","圧力鍋に豚肉、長ねぎ、しょうが、にんにく、煮汁の材料をすべて入れる。","圧力がかかったら20〜25分加圧し、火を止めて自然放置して圧力が下がるまで待つ。","肉を一度取り出して粗熱を取り、煮汁ごと保存容器へ入れる。","冷蔵庫で一晩寝かせる。食べる前にフライパンで表面を軽く焼くか、バーナーで炙ると香ばしく仕上がる。"],"tags":["チャーシューセット","圧力鍋","作り置き","ラーメン"],"memo":"関連レシピ：チャーシュー煮汁の半熟煮卵（AJITAMA-001）。甘めが好きなら砂糖は大さじ5〜6でもOK。豚バラはとろとろ、肩ロースは脂控えめ。煮汁はチャーハン、ラーメンのかえし、炒め物にも活用できます。","relatedCodes":["AJITAMA-001"]},"AJITAMA-001":{"title":"チャーシュー煮汁の半熟煮卵","category":"副菜","servings":"4〜6個","time":"ゆで7分＋漬け12時間","ingredients":["卵 4〜6個","チャーシューの煮汁 300〜500ml","水 適量（煮汁が濃すぎる場合は1〜2割加える）"],"steps":["沸騰したお湯に冷蔵庫から出した卵を入れる。6分30秒でかなりとろとろ、7分で半熟、7分30秒で少し固め、8分で黄身しっかりめ。","ゆで上がったらすぐに氷水へ入れ、5〜10分冷やす。","水の中で殻をむく。","保存袋や保存容器に卵とチャーシューの煮汁を入れる。6時間でほんのり、12時間がおすすめ、24時間でしっかり味。","チャーシューの煮汁がない場合は、醤油100ml・水100ml・みりん50ml・酒50ml・砂糖大さじ1を一度沸騰させ、冷ましてから卵を漬ける。"],"tags":["チャーシューセット","煮卵","半熟卵","ラーメン"],"memo":"関連レシピ：圧力鍋チャーシュー（CHAR-SHU-001）。半熟なら7分ゆで＋12時間漬けがおすすめ。冷蔵で3〜4日以内を目安に食べ切る。","relatedCodes":["CHAR-SHU-001"]}};

const seed = [{
  id:"machichuka-soup",
  title:"町中華風 中華スープ",
  category:"汁物",
  servings:"4人分",
  time:"10分",
  ingredients:[
    "水 800ml",
    "鶏ガラスープの素 大さじ1",
    "しょうゆ 大さじ1",
    "酒 大さじ1",
    "塩 小さじ1/3〜1/2",
    "こしょう 少々",
    "ごま油 小さじ1",
    "長ねぎ 10〜15cm",
    "卵 1個",
    "味の素 2〜4振り（あれば）"
  ],
  steps:[
    "鍋に水・鶏ガラスープの素・しょうゆ・酒・塩を入れて沸かす。",
    "薄切りにした長ねぎを入れて1〜2分煮る。",
    "溶き卵を細く流し入れ、すぐには触らず、ふわっと固まってから軽く混ぜる。",
    "こしょう・ごま油を加えて完成。白こしょうを少し多めにすると町中華らしくなる。"
  ],
  tags:["中華","簡単","卵","スープ"],
  memo:"しょうゆを入れすぎず、鶏ガラ・塩・うま味調味料で味を決めると店っぽい。",
  favorite:true
}];

let recipes = JSON.parse(localStorage.getItem("uchiRecipes") || "null") || seed;
let currentCat = "すべて";
let favOnly = false;


let photoDbPromise=null;
let pendingPhotoData=null;
let removePhotoOnSave=false;

function openPhotoDb(){
  if(photoDbPromise) return photoDbPromise;
  photoDbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open("uchiRecipePhotos",1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains("photos")) db.createObjectStore("photos");
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return photoDbPromise;
}
async function savePhoto(id,dataUrl){
  const db=await openPhotoDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("photos","readwrite");
    tx.objectStore("photos").put(dataUrl,id);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function getPhoto(id){
  const db=await openPhotoDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("photos","readonly");
    const req=tx.objectStore("photos").get(id);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}
async function deletePhoto(id){
  const db=await openPhotoDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction("photos","readwrite");
    tx.objectStore("photos").delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
let cropImage=null;
let cropZoom=1;
let cropX=0;
let cropY=0;
let cropBaseScale=1;
let cropDragging=false;
let cropLastX=0;
let cropLastY=0;

function getCropCanvas(){
  return document.getElementById("photoCropCanvas");
}
function showCropEditor(show=true){
  const wrap=document.getElementById("photoCrop");
  if(wrap) wrap.classList.toggle("show",show);
}
function clampCrop(){
  const canvas=getCropCanvas();
  if(!canvas || !cropImage) return;
  const scale=cropBaseScale*cropZoom;
  const dw=cropImage.naturalWidth*scale;
  const dh=cropImage.naturalHeight*scale;
  const minX=canvas.width-dw;
  const minY=canvas.height-dh;
  cropX=Math.min(0,Math.max(minX,cropX));
  cropY=Math.min(0,Math.max(minY,cropY));
}
function drawCrop(){
  const canvas=getCropCanvas();
  if(!canvas || !cropImage) return;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#111";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  const scale=cropBaseScale*cropZoom;
  const dw=cropImage.naturalWidth*scale;
  const dh=cropImage.naturalHeight*scale;
  clampCrop();
  ctx.drawImage(cropImage,cropX,cropY,dw,dh);
  pendingPhotoData=canvas.toDataURL("image/jpeg",0.82);
  document.getElementById("photoZoomValue").textContent=`${cropZoom.toFixed(2)}×`;
}
function initCropFromDataUrl(dataUrl){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      cropImage=img;
      const canvas=getCropCanvas();
      cropBaseScale=Math.max(canvas.width/img.naturalWidth,canvas.height/img.naturalHeight);
      cropZoom=1;
      const dw=img.naturalWidth*cropBaseScale;
      const dh=img.naturalHeight*cropBaseScale;
      cropX=(canvas.width-dw)/2;
      cropY=(canvas.height-dh)/2;
      const zoom=document.getElementById("photoZoom");
      if(zoom) zoom.value="1";
      showCropEditor(true);
      drawCrop();
      resolve();
    };
    img.onerror=reject;
    img.src=dataUrl;
  });
}
function setPhotoZoom(value){
  if(!cropImage) return;
  const canvas=getCropCanvas();
  const oldScale=cropBaseScale*cropZoom;
  const centerImageX=(canvas.width/2-cropX)/oldScale;
  const centerImageY=(canvas.height/2-cropY)/oldScale;
  cropZoom=Number(value);
  const newScale=cropBaseScale*cropZoom;
  cropX=canvas.width/2-centerImageX*newScale;
  cropY=canvas.height/2-centerImageY*newScale;
  drawCrop();
}
function canvasPointFromEvent(e){
  const canvas=getCropCanvas();
  const rect=canvas.getBoundingClientRect();
  return {
    x:(e.clientX-rect.left)*(canvas.width/rect.width),
    y:(e.clientY-rect.top)*(canvas.height/rect.height)
  };
}
function setupCropPointerEvents(){
  const canvas=getCropCanvas();
  if(!canvas || canvas.dataset.ready) return;
  canvas.dataset.ready="1";
  canvas.addEventListener("pointerdown",e=>{
    if(!cropImage) return;
    cropDragging=true;
    canvas.setPointerCapture(e.pointerId);
    const p=canvasPointFromEvent(e);
    cropLastX=p.x; cropLastY=p.y;
  });
  canvas.addEventListener("pointermove",e=>{
    if(!cropDragging || !cropImage) return;
    const p=canvasPointFromEvent(e);
    cropX+=p.x-cropLastX;
    cropY+=p.y-cropLastY;
    cropLastX=p.x; cropLastY=p.y;
    drawCrop();
  });
  const stop=e=>{
    cropDragging=false;
    try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
  };
  canvas.addEventListener("pointerup",stop);
  canvas.addEventListener("pointercancel",stop);
}
async function handlePhotoSelect(event){
  const file=event.target.files?.[0];
  if(!file) return;
  try{
    const reader=new FileReader();
    reader.onload=async()=>{
      try{
        removePhotoOnSave=false;
        await initCropFromDataUrl(reader.result);
      }catch(e){
        console.error(e);
        alert("写真の読み込みに失敗しました。");
      }
    };
    reader.onerror=()=>alert("写真の読み込みに失敗しました。");
    reader.readAsDataURL(file);
  }catch(e){
    console.error(e);
    alert("写真の読み込みに失敗しました。");
  }
}
function resetCropState(){
  cropImage=null;
  cropZoom=1;
  cropX=0;
  cropY=0;
  cropBaseScale=1;
  cropDragging=false;
  pendingPhotoData=null;
  showCropEditor(false);
  const zoom=document.getElementById("photoZoom");
  if(zoom) zoom.value="1";
  const zv=document.getElementById("photoZoomValue");
  if(zv) zv.textContent="1.00×";
}
function removePendingPhoto(){
  resetCropState();
  removePhotoOnSave=true;
  const input=document.getElementById("fPhoto");
  if(input) input.value="";
}
async function hydrateCardPhotos(){
  const imgs=[...document.querySelectorAll("img[data-photo-id]")];
  for(const img of imgs){
    try{
      const data=await getPhoto(img.dataset.photoId);
      if(data){ img.src=data; img.style.display="block"; }
    }catch(e){}
  }
}
async function hydrateDetailPhoto(id){
  const img=document.getElementById("detailPhoto");
  if(!img) return;
  try{
    const data=await getPhoto(id);
    if(data){ img.src=data; img.style.display="block"; }
    else { img.removeAttribute("src"); img.style.display="none"; }
  }catch(e){}
}
async function hydrateEditPhoto(id){
  try{
    const data=await getPhoto(id);
    if(data){
      removePhotoOnSave=false;
      await initCropFromDataUrl(data);
    }else{
      resetCropState();
    }
  }catch(e){
    resetCropState();
  }
}

function persist(){ localStorage.setItem("uchiRecipes", JSON.stringify(recipes)); }

function categories(){
  return ["すべて","主菜","副菜","汁物","ご飯・麺","デザート","その他"];
}
function renderFilters(){
  document.getElementById("filters").innerHTML = categories().map(c =>
    `<button class="chip ${currentCat===c?'active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join("");
}
function setCat(c){ currentCat=c; render(); }
function toggleFavOnly(){ favOnly=!favOnly; render(); }

function render(){
  renderFilters();
  const q = document.getElementById("search").value.trim().toLowerCase();
  let list = recipes.filter(r => {
    const hitCat = currentCat==="すべて" || r.category===currentCat;
    const hay = [r.title, r.category, ...(r.ingredients||[]), ...(r.tags||[])].join(" ").toLowerCase();
    const hitSearch = !q || hay.includes(q);
    const hitFav = !favOnly || r.favorite;
    return hitCat && hitSearch && hitFav;
  });
  document.getElementById("grid").innerHTML = list.length ? list.map(r=>`
    <div class="card" onclick="openDetail('${r.id}')">
      <div class="card-top">
        <div class="card-main">
          <div class="meta">${r.category} ・ ${r.servings||''}</div>
          <h3>${esc(r.title)}</h3>
          <div class="meta">⏱ ${esc(r.time||'時間未登録')}</div>
        </div>
        <div class="card-side">
          <button class="fav" onclick="event.stopPropagation();toggleFav('${r.id}')">${r.favorite?'★':'☆'}</button>
          <img class="card-thumb" data-photo-id="${esc(r.id)}" alt="${esc(r.title)}" style="display:none">
        </div>
      </div>
      <div class="tags">${(r.tags||[]).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>`).join("") : `<div class="empty">該当するレシピがありません。</div>`;
  hydrateCardPhotos();
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function toggleFav(id){ const r=recipes.find(x=>x.id===id); if(r){r.favorite=!r.favorite;persist();render();} }


function getBaseServings(text){
  const m=String(text||"").match(/(\d+(?:\.\d+)?)/);
  return m ? Number(m[1]) : null;
}
function formatNum(n){
  const rounded=Math.round(n*100)/100;
  if(Number.isInteger(rounded)) return String(rounded);
  return String(rounded).replace(/0+$/,"").replace(/\.$/,"");
}
function parseQty(token){
  if(String(token).includes("/")){
    const [a,b]=String(token).split("/").map(Number);
    return b ? a/b : Number(token);
  }
  return Number(token);
}
function roundStep(value, step){
  return Math.round(value/step)*step;
}
function roundByUnit(value, unit){
  const u=String(unit||"").replace(/\s/g,"");
  if(u==="大さじ" || u==="小さじ") return roundStep(value,0.25);
  if(["ml","mL","g","cc"].includes(u)) return roundStep(value,5);
  if(["kg","L"].includes(u)) return roundStep(value,0.05);
  if(["個","本","枚","袋","パック","丁","玉","束"].includes(u)) return roundStep(value,0.5);
  if(["cm","振り","滴","片","粒"].includes(u)) return roundStep(value,1);
  return roundStep(value,0.25);
}
function scaleIngredient(text, ratio){
  if(ratio===1) return text;
  const re=/(\d+\/\d+|\d+(?:\.\d+)?)(?:\s*[〜~～-]\s*(\d+\/\d+|\d+(?:\.\d+)?))?(\s*(?:大さじ|小さじ|ml|mL|g|kg|L|cc|個|本|枚|袋|パック|丁|玉|束|cm|振り|滴|片|粒))?/g;
  return String(text).replace(re,(m,a,b,unit)=>{
    const u=(unit||"").trim();
    const v1=roundByUnit(parseQty(a)*ratio,u);
    if(b){
      const v2=roundByUnit(parseQty(b)*ratio,u);
      return `${formatNum(v1)}〜${formatNum(v2)}${unit||""}`;
    }
    return `${formatNum(v1)}${unit||""}`;
  });
}

function changeMultiplier(id, delta){
  const current=Number(document.getElementById("servingCount")?.dataset.value || 1);
  const next=Math.max(0.5,Math.round((current+delta)*2)/2);
  openDetail(id,null,next);
}

function changeServings(id, delta){
  const r=recipes.find(x=>x.id===id); if(!r)return;
  const base=getBaseServings(r.servings);
  if(!base){ alert("このレシピは人数が数値で登録されていないため、自動計算できません。"); return; }
  const current=Number(document.getElementById("servingCount")?.dataset.value || base);
  const next=Math.max(1,current+delta);
  openDetail(id,next);
}

function openDetail(id, selectedServings=null, selectedMultiplier=null){
  const r=recipes.find(x=>x.id===id); if(!r)return;
  const base=getBaseServings(r.servings);
  const isPeopleRecipe=!!base;
  const current=isPeopleRecipe ? (selectedServings || base) : (selectedMultiplier || 1);
  const ratio=isPeopleRecipe ? current/base : current;

  const servingControl=isPeopleRecipe ? `
    <div class="serving-box">
      <strong>人数</strong>
      <button class="serving-btn" onclick="changeServings('${r.id}',-1)">−</button>
      <span id="servingCount" class="serving-count" data-value="${current}">${current}人分</span>
      <button class="serving-btn" onclick="changeServings('${r.id}',1)">＋</button>
    </div>` : `
    <div class="serving-box">
      <strong>仕込み量</strong>
      <button class="serving-btn" onclick="changeMultiplier('${r.id}',-0.5)">−</button>
      <span id="servingCount" class="serving-count" data-value="${current}">${formatNum(current)}倍</span>
      <button class="serving-btn" onclick="changeMultiplier('${r.id}',0.5)">＋</button>
    </div>
    <div class="scale-label">0.5倍刻みで材料を自動計算します。</div>`;

  document.getElementById("detailBody").innerHTML=`
    <div class="meta">${esc(r.category)}</div>
    <h2 class="detail-title">${esc(r.title)}</h2>
    <img id="detailPhoto" class="detail-img" alt="${esc(r.title)}" style="display:none">
    <div>
      <span class="badge">⏱ ${esc(r.time||'未登録')}</span>
      ${(r.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}
    </div>
    ${servingControl}
    <div class="section"><h3>材料</h3><ul>${(r.ingredients||[]).map(x=>`<li>${esc(scaleIngredient(x,ratio))}</li>`).join("")}</ul></div>
    <div class="section"><h3>作り方</h3><ol>${(r.steps||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
    ${r.memo?`<div class="section"><h3>メモ</h3><p>${esc(r.memo).replace(/\n/g,"<br>")}</p></div>`:""}
    ${(r.sourceName||r.sourceAuthor||r.sourceUrl)?`<div class="section"><h3>出典</h3><div class="source-box">
      ${r.sourceName?`<div><strong>出典：</strong>${esc(r.sourceName)}</div>`:""}
      ${r.sourceAuthor?`<div><strong>投稿者：</strong>${esc(r.sourceAuthor)}</div>`:""}
      ${r.sourceUrl?`<div><strong>元URL：</strong><a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(r.sourceUrl)}</a></div>`:""}
    </div></div>`:""}
    ${(r.relatedCodes||[]).length?`<div class="section"><h3>関連レシピ</h3><div class="related">${r.relatedCodes.map(code=>{
      const linked=recipes.find(x=>x.code===code);
      const label=linked?linked.title:(recipeCodeRegistry[code]?.title||code);
      return linked
        ? `<button class="ghost" onclick="openDetail('${linked.id}')">↔ ${esc(label)}</button>`
        : `<button class="ghost" onclick="importRelatedCode('${code}')">＋ ${esc(label)}を登録</button>`;
    }).join("")}</div></div>`:""}
    <div class="actions">
      <button class="primary" onclick="openEdit('${r.id}')">✏️ 編集</button>
      <button class="ghost" onclick="toggleFav('${r.id}');openDetail('${r.id}',${isPeopleRecipe?current:'null'},${isPeopleRecipe?'null':current})">${r.favorite?'★ お気に入り解除':'☆ お気に入り'}</button>
      ${r.id!=="machichuka-soup"?`<button class="ghost" onclick="deleteRecipe('${r.id}')">削除</button>`:""}
    </div>`;
  document.getElementById("detailModal").classList.add("show");
  hydrateDetailPhoto(id);
}
let editingRecipeId=null;

function fillFormFromRecipe(r){
  document.getElementById("fTitle").value=r.title||"";
  document.getElementById("fCategory").value=r.category||"その他";
  document.getElementById("fServings").value=r.servings||"";
  document.getElementById("fTime").value=r.time||"";
  document.getElementById("fIngredients").value=(r.ingredients||[]).join("\n");
  document.getElementById("fSteps").value=(r.steps||[]).join("\n");
  document.getElementById("fTags").value=(r.tags||[]).join(",");
  document.getElementById("fMemo").value=r.memo||"";
  document.getElementById("fSourceName").value=r.sourceName||"";
  document.getElementById("fSourceAuthor").value=r.sourceAuthor||"";
  document.getElementById("fSourceUrl").value=r.sourceUrl||"";
}
function openEdit(id){
  const r=recipes.find(x=>x.id===id); if(!r)return;
  editingRecipeId=id;
  window.__pendingRecipeCode=r.code||"";
  window.__pendingRelatedCodes=r.relatedCodes||[];
  document.getElementById("formTitle").textContent="レシピを編集";
  document.getElementById("importNotice").classList.remove("show");
  fillFormFromRecipe(r);
  pendingPhotoData=null;
  removePhotoOnSave=false;
  hydrateEditPhoto(id);
  closeModal("detailModal");
  openAdd();
}

function openAdd(){
  document.getElementById("addModal").classList.add("show");
}
function openAddBlank(){
  editingRecipeId=null;
  resetCropState();
  removePhotoOnSave=false;
  window.__pendingRecipeCode="";
  window.__pendingRelatedCodes=[];
  const photo=document.getElementById("fPhoto"); if(photo) photo.value="";
  document.getElementById("formTitle").textContent="レシピを追加";
  document.getElementById("importNotice").classList.remove("show");
  ["fTitle","fServings","fTime","fIngredients","fSteps","fTags","fMemo","fSourceName","fSourceAuthor","fSourceUrl"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("fCategory").value="主菜";
  openAdd();
}
function closeModal(id){ document.getElementById(id).classList.remove("show"); }

async function saveRecipe(){
  const title=document.getElementById("fTitle").value.trim();
  if(!title){alert("料理名を入力してください");return;}
  const splitLines=id=>document.getElementById(id).value.split(/\n+/).map(x=>x.trim()).filter(Boolean);

  const common={
    title,
    category:document.getElementById("fCategory").value,
    servings:document.getElementById("fServings").value.trim(),
    time:document.getElementById("fTime").value.trim(),
    ingredients:splitLines("fIngredients"),
    steps:splitLines("fSteps"),
    tags:document.getElementById("fTags").value.split(",").map(x=>x.trim()).filter(Boolean),
    memo:document.getElementById("fMemo").value.trim(),
    code:window.__pendingRecipeCode||"",
    relatedCodes:window.__pendingRelatedCodes||[],
    sourceName:document.getElementById("fSourceName").value.trim(),
    sourceAuthor:document.getElementById("fSourceAuthor").value.trim(),
    sourceUrl:document.getElementById("fSourceUrl").value.trim()
  };

  let savedId=editingRecipeId;
  if(editingRecipeId){
    const idx=recipes.findIndex(x=>x.id===editingRecipeId);
    if(idx>=0){
      recipes[idx]={...recipes[idx],...common};
    }
  }else{
    savedId="r"+Date.now();
    recipes.unshift({
      id:savedId,
      ...common,
      favorite:false
    });
  }

  persist();
  try{
    if(removePhotoOnSave) await deletePhoto(savedId);
    else if(pendingPhotoData) await savePhoto(savedId,pendingPhotoData);
  }catch(e){ console.error(e); }
  editingRecipeId=null;
  resetCropState();
  removePhotoOnSave=false;
  window.__pendingRecipeCode="";
  window.__pendingRelatedCodes=[];
  const paste=document.getElementById("chatgptPaste"); if(paste) paste.value="";
  const photoInput=document.getElementById("fPhoto"); if(photoInput) photoInput.value="";
  document.getElementById("importNotice").classList.remove("show");
  document.getElementById("formTitle").textContent="レシピを追加";
  closeModal("addModal");
  ["fTitle","fServings","fTime","fIngredients","fSteps","fTags","fMemo","fSourceName","fSourceAuthor","fSourceUrl"].forEach(id=>document.getElementById(id).value="");
  render();
}
async function deleteRecipe(id){
  if(!confirm("このレシピを削除しますか？"))return;
  recipes=recipes.filter(x=>x.id!==id);persist();try{await deletePhoto(id);}catch(e){}closeModal("detailModal");render();
}

function cleanJsonText(text){
  let t=String(text||"").trim();
  t=t.replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"").trim();
  return t;
}
function validateRecipeData(data){
  if(!data || typeof data!=="object" || Array.isArray(data)) throw new Error("形式が正しくありません。");
  if(!data.title || typeof data.title!=="string") throw new Error("料理名がありません。");
  const out={
    title:String(data.title||""),
    category:String(data.category||"その他"),
    servings:String(data.servings||""),
    time:String(data.time||""),
    ingredients:Array.isArray(data.ingredients)?data.ingredients.map(String):[],
    steps:Array.isArray(data.steps)?data.steps.map(String):[],
    tags:Array.isArray(data.tags)?data.tags.map(String):[],
    memo:String(data.memo||""),
    code:String(data.code||""),
    relatedCodes:Array.isArray(data.relatedCodes)?data.relatedCodes.map(String):[],
    sourceName:String(data.sourceName||""),
    sourceAuthor:String(data.sourceAuthor||""),
    sourceUrl:String(data.sourceUrl||"")
  };
  return out;
}
function normalizeTitleForCompare(title){
  return String(title||"").trim().toLowerCase().replace(/\s+/g,"").replace(/[・･\-ー＿_]/g,"");
}
function findDuplicateRecipe(title){
  const key=normalizeTitleForCompare(title);
  return recipes.find(r=>normalizeTitleForCompare(r.title)===key) || null;
}
function replaceRecipe(existingId, data){
  const idx=recipes.findIndex(r=>r.id===existingId);
  if(idx<0) return;
  const old=recipes[idx];
  recipes[idx]={
    ...old,
    title:data.title,
    category:data.category||"その他",
    servings:data.servings||"",
    time:data.time||"",
    ingredients:Array.isArray(data.ingredients)?data.ingredients:[],
    steps:Array.isArray(data.steps)?data.steps:[],
    tags:Array.isArray(data.tags)?data.tags:[],
    memo:data.memo||"",
    code:data.code||old.code||"",
    relatedCodes:Array.isArray(data.relatedCodes)?data.relatedCodes:(old.relatedCodes||[]),
    sourceName:data.sourceName||old.sourceName||"",
    sourceAuthor:data.sourceAuthor||old.sourceAuthor||"",
    sourceUrl:data.sourceUrl||old.sourceUrl||""
  };
  persist();
  render();
}

function importFromPaste(){
  const box=document.getElementById("chatgptPaste");
  const raw=cleanJsonText(box.value);
  if(!raw){ alert("ChatGPTの登録用データを貼り付けてください。"); return; }
  try{
    const data=validateRecipeData(JSON.parse(raw));
    const dup=findDuplicateRecipe(data.title);
    if(dup){
      const doReplace=confirm(`「${data.title}」はすでに登録されています。\n\nOK：既存レシピを上書き更新\nキャンセル：別レシピとして追加`);
      if(doReplace){
        replaceRecipe(dup.id,data);
        box.value="";
        alert("既存レシピを更新しました。");
        return;
      }
    }
    fillAddForm(data);
  }catch(e){
    alert("読み込みに失敗しました。ChatGPTの「うちレシピ登録用データ」をそのまま貼り付けてください。");
    console.error(e);
  }
}
function clearPaste(){
  document.getElementById("chatgptPaste").value="";
}

function normalizeCode(code){
  return String(code||"").trim().toUpperCase();
}
function importByCode(){
  const input=document.getElementById("recipeCode");
  const code=normalizeCode(input.value);
  if(!code){ alert("登録コードを入力してください。"); return; }
  const data=recipeCodeRegistry[code];
  if(!data){ alert("この登録コードはまだアプリに登録されていません。"); return; }
  fillAddForm({...data, code});
}
function importRelatedCode(code){
  const data=recipeCodeRegistry[normalizeCode(code)];
  if(!data){ alert("関連レシピが見つかりません。"); return; }
  fillAddForm({...data, code:normalizeCode(code)});
}

function fillAddForm(data){
  editingRecipeId=null;
  resetCropState();
  removePhotoOnSave=false;
  const photo=document.getElementById("fPhoto"); if(photo) photo.value="";
  document.getElementById("formTitle").textContent="レシピを追加";
  document.getElementById("fTitle").value=data.title||"";
  const allowed=categories().filter(x=>x!=="すべて");
  document.getElementById("fCategory").value=allowed.includes(data.category)?data.category:"その他";
  document.getElementById("fServings").value=data.servings||"";
  document.getElementById("fTime").value=data.time||"";
  document.getElementById("fIngredients").value=Array.isArray(data.ingredients)?data.ingredients.join("\n"):(data.ingredients||"");
  document.getElementById("fSteps").value=Array.isArray(data.steps)?data.steps.join("\n"):(data.steps||"");
  document.getElementById("fTags").value=Array.isArray(data.tags)?data.tags.join(","):(data.tags||"");
  document.getElementById("fMemo").value=data.memo||"";
  document.getElementById("fSourceName").value=data.sourceName||"";
  document.getElementById("fSourceAuthor").value=data.sourceAuthor||"";
  document.getElementById("fSourceUrl").value=data.sourceUrl||"";
  window.__pendingRecipeCode=data.code||"";
  window.__pendingRelatedCodes=Array.isArray(data.relatedCodes)?data.relatedCodes:[];
  document.getElementById("importNotice").classList.add("show");
  openAdd();
}
function importRecipeFromUrl(){
  const hash=location.hash||"";
  if(!hash.startsWith("#recipe=")) return;
  try{
    const raw=decodeURIComponent(hash.slice(8));
    const data=JSON.parse(raw);
    fillAddForm(data);
    history.replaceState(null,"",location.pathname+location.search);
  }catch(e){
    console.error("レシピ読み込みエラー",e);
    alert("レシピの読み込みに失敗しました。");
  }
}

document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("show")}));
setupCropPointerEvents();
render();
importRecipeFromUrl();
</script>
