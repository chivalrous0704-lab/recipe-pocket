<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>うちレシピ</title>
<style>
:root{
  --bg:#f7f5f0;--card:#fff;--text:#26231f;--muted:#7b746c;--accent:#d46a3a;
  --accent2:#f4dfd2;--border:#e7e0d8;--shadow:0 8px 24px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:rgba(247,245,240,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.wrap{max-width:980px;margin:auto;padding:16px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:24px;margin:0}.sub{font-size:12px;color:var(--muted)}
.version{display:inline-block;margin-left:7px;font-size:11px;font-weight:700;color:#8b3f1f;background:var(--accent2);padding:3px 7px;border-radius:999px;vertical-align:middle}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:white}.ghost{background:white;border:1px solid var(--border);color:var(--text)}
.searchbar{display:flex;gap:8px;margin-top:14px}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;background:white;font:inherit}
textarea{min-height:90px;resize:vertical}
.filters{display:flex;gap:8px;overflow:auto;padding:12px 0 2px}
.chip{white-space:nowrap;background:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 12px;cursor:pointer}
.chip.active{background:var(--accent2);border-color:var(--accent);color:#8b3f1f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);cursor:pointer}
.card h3{margin:0 0 8px;font-size:18px}.meta{color:var(--muted);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:11px;background:#f2efe9;border-radius:999px;padding:5px 8px}
.fav{float:right;font-size:22px;background:none;padding:0}
.empty{padding:40px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.show{display:flex}
.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:white;border-radius:24px 24px 0 0;padding:20px}
.close{float:right;background:#f2efe9;padding:8px 11px}
.section{margin-top:22px}.section h3{font-size:15px;margin-bottom:8px}
ul,ol{padding-left:22px;line-height:1.75}.detail-title{font-size:25px;margin:10px 0 5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.form{display:grid;gap:12px}.help{font-size:12px;color:var(--muted);margin-top:-6px}
.badge{display:inline-block;background:var(--accent2);color:#8b3f1f;border-radius:999px;padding:6px 9px;font-size:12px;margin-right:5px}
.serving-box{display:flex;align-items:center;gap:10px;margin:16px 0 4px;padding:12px;background:#faf7f3;border:1px solid var(--border);border-radius:16px}
.serving-box strong{margin-right:auto}
.serving-btn{width:42px;height:42px;padding:0;border-radius:50%;background:white;border:1px solid var(--border);font-size:22px}
.serving-count{min-width:54px;text-align:center;font-weight:800;font-size:18px}
.import-notice{display:none;background:#fff6d8;border:1px solid #f0d98a;color:#6b5412;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5}
.import-notice.show{display:block}
footer{padding:30px 16px;text-align:center;color:var(--muted);font-size:12px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px;max-height:86vh}}
</style>
</head>
<body>
<!-- app-version: v1.2 -->
<header>
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>🍳 うちレシピ <span class="version">v1.2</span></h1>
        <div class="sub">家で使うレシピを、見やすくひとまとめ</div>
      </div>
      <button class="primary" onclick="openAddBlank()">＋ 追加</button>
    </div>
    <div class="searchbar">
      <input id="search" placeholder="料理名・材料で検索" oninput="render()">
      <button class="ghost" onclick="toggleFavOnly()">★</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>

<main class="wrap">
  <div id="grid" class="grid"></div>
</main>
<footer>データはこの端末のブラウザに保存されます。</footer>

<div class="modal" id="detailModal">
  <div class="sheet">
    <button class="close" onclick="closeModal('detailModal')">✕</button>
    <div id="detailBody"></div>
  </div>
</div>

<div class="modal" id="addModal">
  <div class="sheet">
    <button class="close" onclick="closeModal('addModal')">✕</button>
    <h2>レシピを追加</h2>
    <div class="form">
      <div id="importNotice" class="import-notice">ChatGPTからレシピを読み込みました。内容を確認して「保存する」を押してください。</div>
      <input id="fTitle" placeholder="料理名">
      <div class="row">
        <select id="fCategory">
          <option>主菜</option><option>副菜</option><option>汁物</option><option>ご飯・麺</option><option>デザート</option><option>その他</option>
        </select>
        <input id="fServings" placeholder="人数 例：4人分">
      </div>
      <input id="fTime" placeholder="調理時間 例：10分">
      <textarea id="fIngredients" placeholder="材料を1行ずつ入力&#10;水 800ml&#10;鶏ガラスープの素 大さじ1"></textarea>
      <textarea id="fSteps" placeholder="作り方を1工程ずつ入力&#10;鍋に調味料を入れて沸かす&#10;卵を流し入れる"></textarea>
      <input id="fTags" placeholder="タグ（カンマ区切り）例：簡単,中華,卵">
      <textarea id="fMemo" placeholder="メモ・家族の感想・次回の変更点"></textarea>
      <button class="primary" onclick="saveRecipe()">保存する</button>
      <div class="help">※ レシピはこの端末内に保存されます。</div>
    </div>
  </div>
</div>

<script>
const seed = [{
  id:"machichuka-soup",
  title:"町中華風 中華スープ",
  category:"汁物",
  servings:"4人分",
  time:"10分",
  ingredients:[
    "水 800ml",
    "鶏ガラスープの素 大さじ1",
    "しょうゆ 大さじ1",
    "酒 大さじ1",
    "塩 小さじ1/3〜1/2",
    "こしょう 少々",
    "ごま油 小さじ1",
    "長ねぎ 10〜15cm",
    "卵 1個",
    "味の素 2〜4振り（あれば）"
  ],
  steps:[
    "鍋に水・鶏ガラスープの素・しょうゆ・酒・塩を入れて沸かす。",
    "薄切りにした長ねぎを入れて1〜2分煮る。",
    "溶き卵を細く流し入れ、すぐには触らず、ふわっと固まってから軽く混ぜる。",
    "こしょう・ごま油を加えて完成。白こしょうを少し多めにすると町中華らしくなる。"
  ],
  tags:["中華","簡単","卵","スープ"],
  memo:"しょうゆを入れすぎず、鶏ガラ・塩・うま味調味料で味を決めると店っぽい。",
  favorite:true
}];

let recipes = JSON.parse(localStorage.getItem("uchiRecipes") || "null") || seed;
let currentCat = "すべて";
let favOnly = false;

function persist(){ localStorage.setItem("uchiRecipes", JSON.stringify(recipes)); }

function categories(){
  return ["すべて","主菜","副菜","汁物","ご飯・麺","デザート","その他"];
}
function renderFilters(){
  document.getElementById("filters").innerHTML = categories().map(c =>
    `<button class="chip ${currentCat===c?'active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join("");
}
function setCat(c){ currentCat=c; render(); }
function toggleFavOnly(){ favOnly=!favOnly; render(); }

function render(){
  renderFilters();
  const q = document.getElementById("search").value.trim().toLowerCase();
  let list = recipes.filter(r => {
    const hitCat = currentCat==="すべて" || r.category===currentCat;
    const hay = [r.title, r.category, ...(r.ingredients||[]), ...(r.tags||[])].join(" ").toLowerCase();
    const hitSearch = !q || hay.includes(q);
    const hitFav = !favOnly || r.favorite;
    return hitCat && hitSearch && hitFav;
  });
  document.getElementById("grid").innerHTML = list.length ? list.map(r=>`
    <div class="card" onclick="openDetail('${r.id}')">
      <button class="fav" onclick="event.stopPropagation();toggleFav('${r.id}')">${r.favorite?'★':'☆'}</button>
      <div class="meta">${r.category} ・ ${r.servings||''}</div>
      <h3>${esc(r.title)}</h3>
      <div class="meta">⏱ ${esc(r.time||'時間未登録')}</div>
      <div class="tags">${(r.tags||[]).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>`).join("") : `<div class="empty">該当するレシピがありません。</div>`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function toggleFav(id){ const r=recipes.find(x=>x.id===id); if(r){r.favorite=!r.favorite;persist();render();} }


function getBaseServings(text){
  const m=String(text||"").match(/(\d+(?:\.\d+)?)/);
  return m ? Number(m[1]) : null;
}
function formatNum(n){
  const rounded=Math.round(n*100)/100;
  if(Number.isInteger(rounded)) return String(rounded);
  return String(rounded).replace(/0+$/,"").replace(/\.$/,"");
}
function parseQty(token){
  if(String(token).includes("/")){
    const [a,b]=String(token).split("/").map(Number);
    return b ? a/b : Number(token);
  }
  return Number(token);
}
function roundStep(value, step){
  return Math.round(value/step)*step;
}
function roundByUnit(value, unit){
  const u=String(unit||"").replace(/\s/g,"");
  if(u==="大さじ" || u==="小さじ") return roundStep(value,0.25);
  if(["ml","mL","g","cc"].includes(u)) return roundStep(value,5);
  if(["kg","L"].includes(u)) return roundStep(value,0.05);
  if(["個","本","枚","袋","パック","丁","玉","束"].includes(u)) return roundStep(value,0.5);
  if(["cm","振り","滴","片","粒"].includes(u)) return roundStep(value,1);
  return roundStep(value,0.25);
}
function scaleIngredient(text, ratio){
  if(ratio===1) return text;
  const re=/(\d+\/\d+|\d+(?:\.\d+)?)(?:\s*[〜~～-]\s*(\d+\/\d+|\d+(?:\.\d+)?))?(\s*(?:大さじ|小さじ|ml|mL|g|kg|L|cc|個|本|枚|袋|パック|丁|玉|束|cm|振り|滴|片|粒))?/g;
  return String(text).replace(re,(m,a,b,unit)=>{
    const u=(unit||"").trim();
    const v1=roundByUnit(parseQty(a)*ratio,u);
    if(b){
      const v2=roundByUnit(parseQty(b)*ratio,u);
      return `${formatNum(v1)}〜${formatNum(v2)}${unit||""}`;
    }
    return `${formatNum(v1)}${unit||""}`;
  });
}

function changeServings(id, delta){
  const r=recipes.find(x=>x.id===id); if(!r)return;
  const base=getBaseServings(r.servings);
  if(!base){ alert("このレシピは人数が数値で登録されていないため、自動計算できません。"); return; }
  const current=Number(document.getElementById("servingCount")?.dataset.value || base);
  const next=Math.max(1,current+delta);
  openDetail(id,next);
}

function openDetail(id, selectedServings=null){
  const r=recipes.find(x=>x.id===id); if(!r)return;
  const base=getBaseServings(r.servings);
  const current=selectedServings || base;
  const ratio=(base && current) ? current/base : 1;
  const servingControl=base ? `
    <div class="serving-box">
      <strong>人数</strong>
      <button class="serving-btn" onclick="changeServings('${r.id}',-1)">−</button>
      <span id="servingCount" class="serving-count" data-value="${current}">${current}人分</span>
      <button class="serving-btn" onclick="changeServings('${r.id}',1)">＋</button>
    </div>` : `<div class="meta" style="margin-top:12px">人数：${esc(r.servings||'未登録')}</div>`;
  document.getElementById("detailBody").innerHTML=`
    <div class="meta">${esc(r.category)}</div>
    <h2 class="detail-title">${esc(r.title)}</h2>
    <div>
      <span class="badge">⏱ ${esc(r.time||'未登録')}</span>
      ${(r.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}
    </div>
    ${servingControl}
    <div class="section"><h3>材料</h3><ul>${(r.ingredients||[]).map(x=>`<li>${esc(scaleIngredient(x,ratio))}</li>`).join("")}</ul></div>
    <div class="section"><h3>作り方</h3><ol>${(r.steps||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
    ${r.memo?`<div class="section"><h3>メモ</h3><p>${esc(r.memo).replace(/\n/g,"<br>")}</p></div>`:""}
    <div class="actions">
      <button class="ghost" onclick="toggleFav('${r.id}');openDetail('${r.id}',${current||'null'})">${r.favorite?'★ お気に入り解除':'☆ お気に入り'}</button>
      ${r.id!=="machichuka-soup"?`<button class="ghost" onclick="deleteRecipe('${r.id}')">削除</button>`:""}
    </div>`;
  document.getElementById("detailModal").classList.add("show");
}
function openAdd(){
  document.getElementById("addModal").classList.add("show");
}
function openAddBlank(){
  document.getElementById("importNotice").classList.remove("show");
  openAdd();
}
function closeModal(id){ document.getElementById(id).classList.remove("show"); }

function saveRecipe(){
  const title=document.getElementById("fTitle").value.trim();
  if(!title){alert("料理名を入力してください");return;}
  const splitLines=id=>document.getElementById(id).value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const r={
    id:"r"+Date.now(),
    title,
    category:document.getElementById("fCategory").value,
    servings:document.getElementById("fServings").value.trim(),
    time:document.getElementById("fTime").value.trim(),
    ingredients:splitLines("fIngredients"),
    steps:splitLines("fSteps"),
    tags:document.getElementById("fTags").value.split(",").map(x=>x.trim()).filter(Boolean),
    memo:document.getElementById("fMemo").value.trim(),
    favorite:false
  };
  recipes.unshift(r);persist();document.getElementById("importNotice").classList.remove("show");closeModal("addModal");
  ["fTitle","fServings","fTime","fIngredients","fSteps","fTags","fMemo"].forEach(id=>document.getElementById(id).value="");
  render();
}
function deleteRecipe(id){
  if(!confirm("このレシピを削除しますか？"))return;
  recipes=recipes.filter(x=>x.id!==id);persist();closeModal("detailModal");render();
}

function fillAddForm(data){
  document.getElementById("fTitle").value=data.title||"";
  const allowed=categories().filter(x=>x!=="すべて");
  document.getElementById("fCategory").value=allowed.includes(data.category)?data.category:"その他";
  document.getElementById("fServings").value=data.servings||"";
  document.getElementById("fTime").value=data.time||"";
  document.getElementById("fIngredients").value=Array.isArray(data.ingredients)?data.ingredients.join("\n"):(data.ingredients||"");
  document.getElementById("fSteps").value=Array.isArray(data.steps)?data.steps.join("\n"):(data.steps||"");
  document.getElementById("fTags").value=Array.isArray(data.tags)?data.tags.join(","):(data.tags||"");
  document.getElementById("fMemo").value=data.memo||"";
  document.getElementById("importNotice").classList.add("show");
  openAdd();
}
function importRecipeFromUrl(){
  const hash=location.hash||"";
  if(!hash.startsWith("#recipe=")) return;
  try{
    const raw=decodeURIComponent(hash.slice(8));
    const data=JSON.parse(raw);
    fillAddForm(data);
    history.replaceState(null,"",location.pathname+location.search);
  }catch(e){
    console.error("レシピ読み込みエラー",e);
    alert("レシピの読み込みに失敗しました。");
  }
}

document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("show")}));
render();
importRecipeFromUrl();
</script>
</body>
</html>
